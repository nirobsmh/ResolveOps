[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resolveops"
version = "0.1.0"
description = "Day 1: a typed, auditable LangGraph workflow for customer operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "langchain-openai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
resolveops = "resolveops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resolveops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

